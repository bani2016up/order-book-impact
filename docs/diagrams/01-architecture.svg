<svg xmlns="http://www.w3.org/2000/svg" width="1397.44" height="1178" viewBox="35 5 1397.44 1178" role="img">
<title>Architecture overview</title>
<desc>Local order-book impact toolkit implementation diagram. Editable Excalidraw source is provided alongside this preview.</desc>
