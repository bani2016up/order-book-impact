<svg xmlns="http://www.w3.org/2000/svg" width="1370" height="1338" viewBox="35 5 1370 1338" role="img">
<title>Research layer · where models connect</title>
<desc>Local order-book impact toolkit implementation diagram. Editable Excalidraw source is provided alongside this preview.</desc>
<rect x="35" y="5" width="1370" height="1338" fill="#ffffff"/>
<text fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="32" xml:space="preserve">
<tspan x="60" y="62">Research layer · where models connect</tspan>
</text>
<text fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="18" xml:space="preserve">
<tspan x="60" y="98">Rust produces the shared feature contract; Python researchers consume it</tspan>
</text>
<rect x="60" y="170" width="360" height="175" rx="12" stroke="#334155" stroke-width="1.6" fill="#fef3c7"/>
<text fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="20" xml:space="preserve">
<tspan x="78" y="205">Rust-generated feature dataset</tspan>
</text>
<text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="18" xml:space="preserve">
<tspan x="78" y="242">outputs/features/&lt;name&gt;/</tspan>
<tspan x="78" y="265.4">features.parquet + QC + manifest</tspan>
<tspan x="78" y="288.8">Reuse across model experiments</tspan>
</text>
<rect x="540" y="170" width="360" height="175" rx="12" stroke="#334155" stroke-width="1.6" fill="#ede9fe"/>
<text fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="20" xml:space="preserve">
<tspan x="558" y="205">Installed shared loader</tspan>
</text>
<text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="18" xml:space="preserve">
<tspan x="558" y="242">from ofi_pipeline.research import</tspan>
<tspan x="558" y="265.4">load_features, lag_feature</tspan>
<tspan x="558" y="288.8">Validate accepted keys / UTC / values</tspan>
</text>
<rect x="1020" y="170" width="360" height="175" rx="12" stroke="#334155" stroke-width="1.6" fill="#ede9fe"/>
<text fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="20" xml:space="preserve">
<tspan x="1038" y="205">Model-ready DataFrame</tspan>
</text>
<text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="18" xml:space="preserve">
<tspan x="1038" y="242">OFI L1..L5, mid-price change</tspan>
<tspan x="1038" y="265.4">Depth, TI / volume / quality flags</tspan>
<tspan x="1038" y="288.8">Lags only through adjacent buckets</tspan>
</text>
