<text fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="18" xml:space="preserve">
<tspan x="46" y="448">Inside ofi-core: grouped modules, not additional crates</tspan>
</text>
<rect x="60" y="485" width="360" height="205" rx="12" stroke="#334155" stroke-width="1.6" fill="#dcfce7"/>
<text fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="20" xml:space="preserve">
<tspan x="78" y="520">Ingestion / domain</tspan>
</text>
<text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="18" xml:space="preserve">
<tspan x="78" y="557">adapter.rs: table readers</tspan>
<tspan x="78" y="580.4">domain.rs: typed data and guards</tspan>
<tspan x="78" y="603.8">time.rs: ns / New York validation</tspan>
</text>
<rect x="540" y="485" width="360" height="205" rx="12" stroke="#334155" stroke-width="1.6" fill="#dcfce7"/>
<text fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="20" xml:space="preserve">
<tspan x="558" y="520">Orchestration / scheduling</tspan>
</text>
<text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="18" xml:space="preserve">
<tspan x="558" y="557">pipeline.rs: hashes and ID merge</tspan>
<tspan x="558" y="580.4">worker.rs: std::thread workers</tspan>
<tspan x="558" y="603.8">sync_channel(1); per-session state</tspan>
</text>
<rect x="1020" y="485" width="360" height="205" rx="12" stroke="#334155" stroke-width="1.6" fill="#dcfce7"/>
<text fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="20" xml:space="preserve">
<tspan x="1038" y="520">Feature computation</tspan>
</text>
<text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="18" xml:space="preserve">
<tspan x="1038" y="557">ofi.rs: rank OFI and gap state</tspan>
<tspan x="1038" y="580.4">buckets.rs: grid / mid / depth</tspan>
<tspan x="1038" y="603.8">trades.rs: signing and trade totals</tspan>
</text>
