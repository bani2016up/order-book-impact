<svg xmlns="http://www.w3.org/2000/svg" width="1447.6" height="1378" viewBox="5 5 1447.6 1378" role="img">
<title>Rust crates and module responsibilities</title>
<desc>Local order-book impact toolkit implementation diagram. Editable Excalidraw source is provided alongside this preview.</desc>
<rect x="5" y="5" width="1447.6" height="1378" fill="#ffffff"/>
<text fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="32" xml:space="preserve">
<tspan x="60" y="62">Rust crates and module responsibilities</tspan>
</text>
<text fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="18" xml:space="preserve">
<tspan x="60" y="98">Only two Cargo workspace crates • arrows show calls, ownership or build dependencies</tspan>
</text>
<rect x="60" y="170" width="360" height="175" rx="12" stroke="#334155" stroke-width="1.6" fill="#dbeafe"/>
<text fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="20" xml:space="preserve">
<tspan x="78" y="205">Python wheel / package</tspan>
</text>
<text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="18" xml:space="preserve">
<tspan x="78" y="242">maturin → ofi_pipeline._native</tspan>
<tspan x="78" y="265.4">PyO3 abi3-py310 (Python ≥3.10)</tspan>
<tspan x="78" y="288.8">Platform-specific shared library</tspan>
</text>
<rect x="540" y="170" width="360" height="175" rx="12" stroke="#334155" stroke-width="1.6" fill="#dbeafe"/>
<text fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="20" xml:space="preserve">
<tspan x="558" y="205">ofi-python</tspan>
</text>
<text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="18" xml:space="preserve">
<tspan x="558" y="242">crates/ofi-python/src/lib.rs</tspan>
<tspan x="558" y="265.4">version / validate_config / run_pipeline</tspan>
<tspan x="558" y="288.8">PyO3 + serde / serde_json</tspan>
</text>
<rect x="1020" y="170" width="360" height="175" rx="12" stroke="#334155" stroke-width="1.6" fill="#dcfce7"/>
<text fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="20" xml:space="preserve">
