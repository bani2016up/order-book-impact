</text>
<text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="18" xml:space="preserve">
<tspan x="1038" y="242">Pure Rust library (no Python)</tspan>
<tspan x="1038" y="265.4">Public modules in src/lib.rs</tspan>
<tspan x="1038" y="288.8">Private worker module</tspan>
</text>
