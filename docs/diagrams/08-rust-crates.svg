<rect x="60" y="930" width="360" height="205" rx="12" stroke="#334155" stroke-width="1.6" fill="#dcfce7"/>
<text fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="20" xml:space="preserve">
<tspan x="78" y="965">Shared contracts</tspan>
</text>
<text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="18" xml:space="preserve">
<tspan x="78" y="1002">config.rs: limits/session/signing</tspan>
<tspan x="78" y="1025.4">error.rs: typed errors + overflow</tspan>
<tspan x="78" y="1048.8">Used across engine modules</tspan>
</text>
<rect x="540" y="930" width="360" height="205" rx="12" stroke="#334155" stroke-width="1.6" fill="#dcfce7"/>
<text fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="20" xml:space="preserve">
<tspan x="558" y="965">Persistence / publication</tspan>
</text>
<text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="18" xml:space="preserve">
<tspan x="558" y="1002">output.rs: Arrow / ZSTD Parquet</tspan>
<tspan x="558" y="1025.4">Ordered append_partition</tspan>
<tspan x="558" y="1048.8">Transaction / provenance JSON</tspan>
</text>
<rect x="1020" y="930" width="360" height="205" rx="12" stroke="#334155" stroke-width="1.6" fill="#dcfce7"/>
<text fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="20" xml:space="preserve">
<tspan x="1038" y="965">Original raw quotes</tspan>
</text>
<text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="18" xml:space="preserve">
