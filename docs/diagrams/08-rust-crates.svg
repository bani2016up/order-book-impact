<tspan x="1220" y="798">optional raw signing</tspan>
</text>
<rect x="60" y="1280" width="1320" height="78" rx="12" stroke="#cbd5e1" stroke-width="1.6" fill="#f8fafc"/>
<text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="18" xml:space="preserve">
<tspan x="78" y="1313">Main libraries: Arrow/Parquet for tables, csv/flate2/zip for streams, chrono/chrono-tz for time, sha2 for provenance.</tspan>
<tspan x="78" y="1336.4">Bounded local-day metadata is reused by table readers; cached column names and CSV records avoid repeated allocations.</tspan>
</text>
