<tspan x="260" y="836">BucketRow sink</tspan>
</text>
<polyline points="420,1037 540,1037" stroke="#334155" stroke-width="1.6" fill="none"/>
<polyline points="529.19,1042.22 540,1037 529.19,1031.78" fill="none" stroke="#334155" stroke-width="1.6"/>
<text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="16" xml:space="preserve">
<tspan x="432" y="1015">read once</tspan>
</text>
<polyline points="900,1037 1020,1037" stroke="#334155" stroke-width="1.6" fill="none"/>
<polyline points="1009.19,1042.22 1020,1037 1009.19,1031.78" fill="none" stroke="#334155" stroke-width="1.6"/>
<text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="16" xml:space="preserve">
<tspan x="925" y="998">closed</tspan>
<tspan x="925" y="1018.8">file set</tspan>
</text>
<rect x="60" y="1210" width="1320" height="78" rx="12" stroke="#cbd5e1" stroke-width="1.6" fill="#f8fafc"/>
<text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="18" xml:space="preserve">
<tspan x="78" y="1243">State is never independently initialized per arbitrary chunk. Temporary disk scales with partition output and raw ZIP payloads.</tspan>
<tspan x="78" y="1266.4">Publication is a filesystem rename workflow; overwrite has a brief absence window and is not a database transaction.</tspan>
</text>
</svg>
