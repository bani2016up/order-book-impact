<text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="16" xml:space="preserve">
<tspan x="919" y="231">receive</tspan>
</text>
<rect x="1020" y="505" width="360" height="205" rx="12" stroke="#334155" stroke-width="1.6" fill="#dcfce7"/>
<text fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="20" xml:space="preserve">
<tspan x="1038" y="540">Persistent OFI / bucket state</tspan>
</text>
<text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="18" xml:space="preserve">
<tspan x="1038" y="577">OfiState clears at rejected rows</tspan>
<tspan x="1038" y="600.4">Initialization produces unknown OFI</tspan>
<tspan x="1038" y="623.8">BucketEngine keeps original boundaries</tspan>
</text>
<rect x="540" y="505" width="360" height="205" rx="12" stroke="#334155" stroke-width="1.6" fill="#dcfce7"/>
<text fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="20" xml:space="preserve">
<tspan x="558" y="540">Independent execution path</tspan>
</text>
<text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="18" xml:space="preserve">
<tspan x="558" y="577">TradeSequence prevents duplicates</tspan>
<tspan x="558" y="600.4">Known direction / raw Quote Test</tspan>
<tspan x="558" y="623.8">All trade volume; explicit unknown TI</tspan>
</text>
<rect x="60" y="505" width="360" height="205" rx="12" stroke="#334155" stroke-width="1.6" fill="#dcfce7"/>
<text fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="20" xml:space="preserve">
<tspan x="78" y="540">Right-closed bucket output</tspan>
</text>
<text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="18" xml:space="preserve">
<tspan x="78" y="577">(start, end], NYC-open anchored</tspan>
<tspan x="78" y="600.4">One open bucket; L1 update depth</tspan>
<tspan x="78" y="623.8">First incomplete / bad buckets flagged</tspan>
</text>
