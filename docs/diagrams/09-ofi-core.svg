<svg xmlns="http://www.w3.org/2000/svg" width="1370" height="1308" viewBox="35 5 1370 1308" role="img">
<title>ofi-core · concurrency and output lifecycle</title>
<desc>Local order-book impact toolkit implementation diagram. Editable Excalidraw source is provided alongside this preview.</desc>
<rect x="35" y="5" width="1370" height="1308" fill="#ffffff"/>
<text fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="32" xml:space="preserve">
<tspan x="60" y="62">ofi-core · concurrency and output lifecycle</tspan>
</text>
<text fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="18" xml:space="preserve">
<tspan x="60" y="98">Runtime pipeline • each symbol/date partition has one persistent stateful worker</tspan>
</text>
<rect x="60" y="160" width="360" height="190" rx="12" stroke="#334155" stroke-width="1.6" fill="#dcfce7"/>
<text fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="20" xml:space="preserve">
<tspan x="78" y="195">Ordered producer</tspan>
</text>
<text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="18" xml:space="preserve">
<tspan x="78" y="232">pipeline::run()</tspan>
<tspan x="78" y="255.4">Validate config / hash / open readers</tspan>
<tspan x="78" y="278.8">Merge every original quality row</tspan>
</text>
<rect x="540" y="160" width="360" height="190" rx="12" stroke="#334155" stroke-width="1.6" fill="#dcfce7"/>
<text fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="20" xml:space="preserve">
<tspan x="558" y="195">Bounded chunk transport</tspan>
</text>
<text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="18" xml:space="preserve">
<tspan x="558" y="232">Vec&lt;InputRow&gt;: chunk_rows bound</tspan>
<tspan x="558" y="255.4">sync_channel(1) per worker</tspan>
<tspan x="558" y="278.8">Producer blocks on a full queue</tspan>
</text>
<rect x="1020" y="160" width="360" height="190" rx="12" stroke="#334155" stroke-width="1.6" fill="#dcfce7"/>
<text fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="20" xml:space="preserve">
<tspan x="1038" y="195">Partition worker</tspan>
</text>
<text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="18" xml:space="preserve">
<tspan x="1038" y="232">std::thread; one symbol + date</tspan>
<tspan x="1038" y="255.4">Active workers ≤ config.threads</tspan>
<tspan x="1038" y="278.8">Same worker across chunk boundaries</tspan>
</text>
