<polyline points="1194.78,494.19 1200,505 1205.22,494.19" fill="none" stroke="#334155" stroke-width="1.6"/>
<text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="16" xml:space="preserve">
<tspan x="1220" y="426">sequential rows</tspan>
</text>
<polyline points="1060,350 1060,420 720,420 720,505" stroke="#334155" stroke-width="1.6" fill="none"/>
<polyline points="714.78,494.19 720,505 725.22,494.19" fill="none" stroke="#334155" stroke-width="1.6"/>
