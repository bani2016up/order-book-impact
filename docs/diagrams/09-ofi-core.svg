<polyline points="430.81,659.78 420,665 430.81,670.22" fill="none" stroke="#334155" stroke-width="1.6"/>
<text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="16" xml:space="preserve">
<tspan x="790" y="758">OFI + boundary state</tspan>
</text>
<polyline points="540,607 420,607" stroke="#334155" stroke-width="1.6" fill="none"/>
<polyline points="430.81,601.78 420,607 430.81,612.22" fill="none" stroke="#334155" stroke-width="1.6"/>
<text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="16" xml:space="preserve">
<tspan x="430" y="568">trade +</tspan>
<tspan x="430" y="588.8">Option&lt;sign&gt;</tspan>
</text>
<rect x="60" y="935" width="360" height="205" rx="12" stroke="#334155" stroke-width="1.6" fill="#fef3c7"/>
<text fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="20" xml:space="preserve">
<tspan x="78" y="970">Private partition output</tspan>
</text>
<text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="18" xml:space="preserve">
<tspan x="78" y="1007">Worker&#x27;s output.rs::Writer</tspan>
<tspan x="78" y="1030.4">Accepted + full-grid Parquet</tspan>
<tspan x="78" y="1053.8">ZSTD; buffers ≤ min(chunk_rows,4096)</tspan>
</text>
<rect x="540" y="935" width="360" height="205" rx="12" stroke="#334155" stroke-width="1.6" fill="#dcfce7"/>
<text fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="20" xml:space="preserve">
<tspan x="558" y="970">Ordered final assembly</tspan>
</text>
<text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="18" xml:space="preserve">
<tspan x="558" y="1007">Close sender → join worker</tspan>
<tspan x="558" y="1030.4">Append partition Parquet in key order</tspan>
<tspan x="558" y="1053.8">Close final writers; write manifest/QC</tspan>
</text>
<rect x="1020" y="935" width="360" height="205" rx="12" stroke="#334155" stroke-width="1.6" fill="#fef3c7"/>
<text fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="20" xml:space="preserve">
<tspan x="1038" y="970">Whole-directory publication</tspan>
</text>
<text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="18" xml:space="preserve">
<tspan x="1038" y="1007">.ofi-stage-* → destination</tspan>
<tspan x="1038" y="1030.4">Overwrite owned results via backup</tspan>
<tspan x="1038" y="1053.8">Restore or preserve backup on failure</tspan>
</text>
<polyline points="240,710 240,935" stroke="#334155" stroke-width="1.6" fill="none"/>
<polyline points="234.78,924.19 240,935 245.22,924.19" fill="none" stroke="#334155" stroke-width="1.6"/>
