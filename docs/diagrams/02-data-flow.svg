<rect x="60" y="1100" width="1320" height="78" rx="12" stroke="#cbd5e1" stroke-width="1.6" fill="#f8fafc"/>
<text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="18" xml:space="preserve">
<tspan x="78" y="1133">Provenance: separate streaming source SHA-256 pass → manifest; input files remain immutable during the run.</tspan>
