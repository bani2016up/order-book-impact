<tspan x="78" y="958.8">Research outputs + run metadata</tspan>
</text>
<rect x="540" y="840" width="360" height="205" rx="12" stroke="#334155" stroke-width="1.6" fill="#ede9fe"/>
<text fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="20" xml:space="preserve">
