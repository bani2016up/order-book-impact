<svg xmlns="http://www.w3.org/2000/svg" width="1518.32" height="1198" viewBox="35 5 1518.32 1198" role="img">
<title>Data flow / implementation blueprint</title>
<desc>Local order-book impact toolkit implementation diagram. Editable Excalidraw source is provided alongside this preview.</desc>
<rect x="35" y="5" width="1518.32" height="1198" fill="#ffffff"/>
<text fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="32" xml:space="preserve">
<tspan x="60" y="62">Data flow / implementation blueprint</tspan>
</text>
<text fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="18" xml:space="preserve">
<tspan x="60" y="98">Arrows carry data • original IDs drive the merge; timestamps define aggregation boundaries</tspan>
</text>
<rect x="60" y="160" width="360" height="205" rx="12" stroke="#334155" stroke-width="1.6" fill="#fef3c7"/>
<text fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="20" xml:space="preserve">
<tspan x="78" y="195">Lev-v1 clean tables</tspan>
</text>
<text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="18" xml:space="preserve">
<tspan x="78" y="232">events_clean: accepted books</tspan>
<tspan x="78" y="255.4">trades_clean: executions</tspan>
<tspan x="78" y="278.8">event_quality: every original row</tspan>
</text>
<rect x="540" y="160" width="360" height="205" rx="12" stroke="#334155" stroke-width="1.6" fill="#dcfce7"/>
<text fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="20" xml:space="preserve">
