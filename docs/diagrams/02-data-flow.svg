</text>
<text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="18" xml:space="preserve">
<tspan x="558" y="232">Parquet / CSV / CSV.gz</tspan>
<tspan x="558" y="255.4">Schema, order, price/time checks</tspan>
<tspan x="558" y="278.8">Typed Event / Trade / Quality</tspan>
</text>
<rect x="1020" y="160" width="360" height="205" rx="12" stroke="#334155" stroke-width="1.6" fill="#dcfce7"/>
<text fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="20" xml:space="preserve">
<tspan x="1038" y="195">Original-ID merge</tspan>
</text>
<text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="18" xml:space="preserve">
<tspan x="1038" y="232">Quality drives the producer</tspan>
<tspan x="1038" y="255.4">Key: symbol, date, event_id</tspan>
<tspan x="1038" y="278.8">InputRow = quality + optional data</tspan>
</text>
