name: Native pipeline checks
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  native-and-wheel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v9
        with:
          version: '0.9.13'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy
      - name: Sync locked tools and research dependencies
        run: uv sync --locked --all-extras --no-install-project
      - name: Select the project interpreter for PyO3
        shell: bash
        run: echo "PYO3_PYTHON=$(uv run --no-sync python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: uv build --wheel --out-dir dist
      - name: Install current built wheel for the full compiled suite
        run: uv run --no-sync python -c "import glob,subprocess,sys; subprocess.check_call(['uv','pip','install','--python',sys.executable,'--reinstall','--no-deps',glob.glob('dist/*.whl')[0]])"
      - run: uv run --no-sync python -m pytest -q tests/python tests/integration tests/research tests/benchmarks
      - run: uv run --no-sync ruff check python research tests benchmarks scripts
      - run: uv run --no-sync mypy
      - name: Fresh wheel environment outside checkout
        run: uv run --no-sync python scripts/wheel_check.py "dist/*.whl"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.python }}
          path: dist/*.whl

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v9
        with:
          version: '0.9.13'
          python-version: '3.12'
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.90.0'
          components: llvm-tools-preview
      - name: Sync locked coverage environment
        run: uv sync --locked --all-extras
      - name: Measure core, actual native library and Python separately
        run: uv run --no-sync python scripts/coverage.py
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-evidence
          path: target/coverage-report/
